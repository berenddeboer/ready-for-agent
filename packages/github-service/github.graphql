schema {
  query: Query
  mutation: Mutation
}

scalar DateTime
scalar URI
scalar ID
scalar GitObjectID

type Query {
  node(id: ID!): Node
  repository(owner: String!, name: String!): Repository
  viewer: User!
}

type Mutation {
  markPullRequestReadyForReview(
    input: MarkPullRequestReadyForReviewInput!
  ): MarkPullRequestReadyForReviewPayload
  mergePullRequest(input: MergePullRequestInput!): MergePullRequestPayload
  createPullRequest(input: CreatePullRequestInput!): CreatePullRequestPayload
  updatePullRequest(input: UpdatePullRequestInput!): UpdatePullRequestPayload
  deleteRef(input: DeleteRefInput!): DeleteRefPayload
  addComment(input: AddCommentInput!): AddCommentPayload
  updateIssueComment(input: UpdateIssueCommentInput!): UpdateIssueCommentPayload
  closeIssue(input: CloseIssueInput!): CloseIssuePayload
  createIssue(input: CreateIssueInput!): CreateIssuePayload
  addSubIssue(input: AddSubIssueInput!): AddSubIssuePayload
  addLabelsToLabelable(
    input: AddLabelsToLabelableInput!
  ): AddLabelsToLabelablePayload
}

input CreateIssueInput {
  repositoryId: ID!
  parentIssueId: ID
  labelIds: [ID!]
  title: String!
  body: String
}

type CreateIssuePayload {
  issue: Issue
}

input AddSubIssueInput {
  issueId: ID!
  subIssueId: ID
}

type AddSubIssuePayload {
  subIssue: Issue
}

input AddLabelsToLabelableInput {
  labelableId: ID!
  labelIds: [ID!]
}

type AddLabelsToLabelablePayload {
  labelable: Labelable
}

interface Labelable {
  id: ID!
}

input CreatePullRequestInput {
  repositoryId: ID!
  baseRefName: String!
  headRefName: String!
  title: String!
  body: String
  draft: Boolean
  clientMutationId: String
}

type CreatePullRequestPayload {
  clientMutationId: String
  pullRequest: PullRequest
}

input UpdatePullRequestInput {
  pullRequestId: ID!
  state: PullRequestUpdateState
  title: String
  body: String
  clientMutationId: String
}

enum PullRequestUpdateState {
  OPEN
  CLOSED
}

input DeleteRefInput {
  refId: ID!
  clientMutationId: String
}

type DeleteRefPayload {
  clientMutationId: String
}

type UpdatePullRequestPayload {
  clientMutationId: String
  pullRequest: PullRequest
}

input AddCommentInput {
  subjectId: ID!
  body: String!
  clientMutationId: String
}

type AddCommentPayload {
  clientMutationId: String
  commentEdge: IssueCommentEdge
}

type IssueCommentEdge {
  node: IssueComment
}

input UpdateIssueCommentInput {
  id: ID!
  body: String!
}

type UpdateIssueCommentPayload {
  issueComment: IssueComment
}

input CloseIssueInput {
  issueId: ID!
  stateReason: IssueClosedStateReason
  clientMutationId: String
}

type CloseIssuePayload {
  clientMutationId: String
  issue: Issue
}

enum IssueClosedStateReason {
  COMPLETED
  NOT_PLANNED
  DUPLICATE
}

input MarkPullRequestReadyForReviewInput {
  pullRequestId: ID!
  clientMutationId: String
}

type MarkPullRequestReadyForReviewPayload {
  clientMutationId: String
  pullRequest: PullRequest
}

input MergePullRequestInput {
  pullRequestId: ID!
  expectedHeadOid: GitObjectID
  mergeMethod: PullRequestMergeMethod
  clientMutationId: String
}

enum PullRequestMergeMethod {
  MERGE
  SQUASH
  REBASE
}

enum MergeableState {
  CONFLICTING
  MERGEABLE
  UNKNOWN
}

type MergePullRequestPayload {
  clientMutationId: String
  pullRequest: PullRequest
}

type Repository {
  id: ID!
  nameWithOwner: String!
  defaultBranchRef: Ref
  ref(qualifiedName: String!): Ref
  issues(
    first: Int
    after: String
    labels: [String!]
    states: [IssueState!]
  ): IssueConnection!
  issue(number: Int!): Issue
  label(name: String!): Label
  pullRequests(
    first: Int
    after: String
    states: [PullRequestState!]
    headRefName: String
  ): PullRequestConnection!
}

type Ref {
  id: ID!
  name: String!
}

type PullRequestConnection {
  nodes: [PullRequest]
  pageInfo: PageInfo!
}

type PullRequest {
  id: ID!
  number: Int!
  title: String!
  body: String!
  url: URI!
  state: PullRequestState!
  merged: Boolean!
  isDraft: Boolean!
  createdAt: DateTime!
  headRefOid: String!
  headRefName: String!
  headRepository: Repository
  baseRefName: String!
  mergeable: MergeableState!
  statusCheckRollup: StatusCheckRollup
  commits(last: Int): PullRequestCommitConnection!
  repository: Repository!
}

type PullRequestCommitConnection {
  nodes: [PullRequestCommit]
}

type PullRequestCommit {
  commit: Commit!
}

type Commit {
  oid: GitObjectID!
  pushedDate: DateTime
}

type StatusCheckRollup {
  state: StatusState!
  contexts(first: Int, after: String): StatusCheckRollupContextConnection!
}

type StatusCheckRollupContextConnection {
  nodes: [StatusCheckRollupContext]
  pageInfo: PageInfo!
}

union StatusCheckRollupContext = CheckRun | StatusContext

type CheckRun {
  id: ID!
  databaseId: Int
  name: String!
  status: CheckStatusState!
  conclusion: CheckConclusionState
  startedAt: DateTime
  completedAt: DateTime
}

type StatusContext {
  id: ID!
  context: String!
  state: StatusState!
  createdAt: DateTime!
}

enum PullRequestState {
  OPEN
  CLOSED
  MERGED
}

enum StatusState {
  EXPECTED
  ERROR
  FAILURE
  PENDING
  SUCCESS
}

enum CheckStatusState {
  QUEUED
  IN_PROGRESS
  COMPLETED
  WAITING
  PENDING
  REQUESTED
}

enum CheckConclusionState {
  ACTION_REQUIRED
  CANCELLED
  FAILURE
  NEUTRAL
  SUCCESS
  SKIPPED
  STALE
  TIMED_OUT
  STARTUP_FAILURE
}

type IssueConnection {
  nodes: [Issue]
  pageInfo: PageInfo!
  totalCount: Int!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type Actor {
  login: String!
}

type User {
  login: String!
}

interface Node {
  id: ID!
}

type Issue implements Node & Labelable {
  id: ID!
  number: Int!
  title: String!
  body: String!
  url: URI!
  createdAt: DateTime!
  state: IssueState!
  stateReason: IssueStateReason
  author: Actor
  labels(first: Int, after: String): LabelConnection
  repository: Repository!
  parent: Issue
  comments(first: Int, after: String): IssueCommentConnection!
  subIssues(first: Int, after: String): IssueConnection!
  subIssuesSummary: SubIssuesSummary!
  blockedBy(first: Int, after: String): IssueConnection!
  closedByPullRequestsReferences(
    first: Int
    after: String
    includeClosedPrs: Boolean
  ): PullRequestConnection!
}

enum IssueStateReason {
  COMPLETED
  NOT_PLANNED
  DUPLICATE
  REOPENED
}

type LabelConnection {
  nodes: [Label]
  pageInfo: PageInfo!
}

type Label {
  id: ID!
  name: String!
}

type IssueCommentConnection {
  nodes: [IssueComment]
  pageInfo: PageInfo!
  totalCount: Int!
}

type IssueComment {
  id: ID!
  body: String!
  url: URI!
  lastEditedAt: DateTime
}

type SubIssuesSummary {
  total: Int!
}

enum IssueState {
  OPEN
  CLOSED
}
