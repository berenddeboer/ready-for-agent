  pause control so clients do not scrape chips for drain vs idle.
  """
  hasActiveStepRun: Boolean!
  canRetry: Boolean!
  isTerminal: Boolean!
  stateReadyAt: String!
  worktreePath: String
  startingCommitOid: String
  """
  Markdown completion summary for a No-Change Outcome; null when the Work Item
  produced repository changes or has not confirmed no-change yet.
  """
  completionSummary: String
  sessionId: String
  failureCode: String
  createdAt: String!
  updatedAt: String!
  stateResidenceMs: Float!
  lifecycleLabels: [LifecycleLabel!]!
}

input AddRepositoryInput {
  forge: String!
  forgeHost: String!
  projectPath: String!
  localPath: String!
  isBare: Boolean!
}

input UpdateConfigInput {
  selectedAgentBackend: String!
  """
  Required when not changing Agent Backend. Optional on backend change
  (empty is allowed, same as first-run).
  """
  defaultModel: String
  """
  Optional. Must be advertised by the governing build Agent Model when set.
  Whitespace is stored as null (backend/model default).
  """
  defaultThinkingLevel: String
  reviewModel: String
  """
  Optional. Must be advertised by the governing review Agent Model when set.
  Whitespace is stored as null.
  """
  reviewThinkingLevel: String
  maxConcurrentAgentTurns: Int!
  maxConcurrentWorkItems: Int!
}

input UpdateRepositorySettingsInput {
  repositoryId: ID!
  forge: String
  forgeHost: String
  projectPath: String
  paused: Boolean!
  """
  Set the Repository Agent Backend override, pass null to clear (inherit
  harness default), or omit to leave the stored override unchanged.
  """
  selectedAgentBackend: String
  defaultModel: String
  """
  Optional. Applicable only when this write also supplies an explicit
  Repository build model. Otherwise this value is dormant and preserved.
  """
  defaultThinkingLevel: String
  reviewModel: String
  """
  Optional. Applicable when this write supplies an explicit Repository review
  model, or when neither scope has a distinct review model. Dormant values
  are preserved rather than deleted.
  """
  reviewThinkingLevel: String
  autoMerge: Boolean!
  includeAllIssueAuthors: Boolean!
  """
  Wait for checks to start after ready for review (Ready-Phase Status Check Round).
  Defaults to true. Disable only when the ready transition cannot start relevant workflows.
  """
  waitForReadyForReviewChecks: Boolean!
}

type Mutation {
  addRepository(input: AddRepositoryInput!): Repository!
  """
  Inspect a host path (same rules as the operator `add` command: directory,
  git repository, resolvable GitHub remote, bare detection) and register it.
  Prefer this over client-side inspect + addRepository so inspect stays one
  deep server module.
  """
  addLocalRepository(path: String!): Repository!
  inspectLocalRepository(path: String!): LocalRepositoryInspection!
  """
  Open a native OS folder dialog on the Harness host. Returns the absolute
  path, or null when the user cancels or no dialog tool is available.
  """
  pickLocalDirectory: String
  addRepositoryGitHubToken(repositoryId: ID!): RepositoryCredential!
  """
  Add a per-Repository GitLab PAT to the Keymaxxer vault (provider gitlab,
  account <forge-host>/<project-path>) and activate Issue Polling.
  """
  addRepositoryGitLabToken(repositoryId: ID!): RepositoryCredential!
  removeRepository(repositoryId: ID!): ID!
  refreshRepository(repositoryId: ID!): RefreshJob!
  implementNow(repositoryId: ID!, issueNumber: Int!): WorkItem!
  """
  Create a Work Item for an Actionable Issue with one complete Explicit Work
  Item Execution Profile. Submission activates and inspects an otherwise
  inactive shipped Agent Backend under the settings/create coordination
  boundary. Partial profiles cannot be represented. Failure creates nothing
  and leaves saved defaults unchanged.
  """
  implementWith(
    repositoryId: ID!
    issueNumber: Int!
    profile: ExplicitWorkItemExecutionProfileInput!
    options: ImplementWithOptionsInput
  ): WorkItem!
  """
  Create a Work Item that runs local steps through Review, then pauses before Commit.
  """
  implementLocally(repositoryId: ID!, issueNumber: Int!): WorkItem!
  """
  Parent-level Implement all with auto-merge. Snapshots open direct Child Issues
  and atomically enrolls them: creates ordinary Work Items with Merge Mode ALWAYS
  for children without an unfinished Work Item (unblocked → Implement Now
  admission; blocked → Queue / Waiting for blockers); sets Merge Mode ALWAYS on
  each existing unfinished child Work Item without resetting lifecycle state,
  history, admission, Session, worktree, or PR. A merge-related Needs Human
  handoff stays stopped. Returns covered child Work Items. Does not create a
  Parent Work Item.
  """
  implementAllWithAutoMerge(repositoryId: ID!, issueNumber: Int!): [WorkItem!]!
  """
  Queue a Relevant open leaf Issue that has listed blockers: creates a Work Item
  in Waiting for blockers (no Worker Slot, no Step Run).
  """
  queue(repositoryId: ID!, issueNumber: Int!): WorkItem!
  """
  Synchronous best-effort Repository Intake: reclassify current Intake
  Candidates for one Repository, run one shared Repository preflight when the
  set is nonempty, then process each candidate sequentially through ordinary
  Implement Now or Queue. Candidate-local races become per-Issue failed
  results; infrastructure, cancellation, and unexpected defects stop as
  GraphQL errors while preserving earlier Work Items. No Intake entity or
  persistence is created. Empty classification is a successful no-op and
  bypasses preflight.
  """
  startRepositoryIntake(repositoryId: ID!): RepositoryIntakeResult!
  """
  Synchronous best-effort Retry: resolve one Issue's unfinished Work Item,
  one Work Item in this Repository, or every currently retryable Work Item
  (Harness-owned canRetry). Process accepted targets sequentially through
  ordinary Work Item Retry. --all-retryable applies the Autonomous Retry
  Budget (default 3, override with maxAutonomousRetries). Ineligible races
  become per-item skipped results; concurrent active-run conflicts become
  per-item failed results; budget exhaustion is LIMIT_REACHED; a future
  provider hold is DEFERRED. Infrastructure, cancellation, and unexpected
  defects stop as GraphQL errors while preserving earlier retries. Empty
  --all-retryable selection is a successful no-op.
  """
  retryWorkItems(
    repositoryId: ID!
    selector: RetryWorkItemsSelector!
    """
    Maximum accepted Autonomous Retry execution attempts per Work Item at
    its current Lifecycle Step. Used only with allRetryable. Default 3.
    Must be a non-negative integer. Explicit issue/work-item Retry ignores
    this budget.
    """
    maxAutonomousRetries: Int
  ): RetryWorkItemsResult!
  retryWorkItem(workItemId: ID!): WorkItem!
  pauseWorkItem(workItemId: ID!): WorkItem!
  """
  Stop a running Step Run on a paused Work Item without deleting it.
  Legal only while paused and a Step Run is running. Resume is Retry.
  """
  interruptWorkItem(workItemId: ID!): WorkItem!
  startWorkItem(workItemId: ID!): WorkItem!
  resetWorkItem(workItemId: ID!): ID!
  updateConfig(input: UpdateConfigInput!): Config!
  """
  Revalidate one Active Agent Backend by id and refresh its model catalog.
  When backendId is omitted, rechecks the harness default (Config.selectedAgentBackend).
  Does not activate a backend that is not already Active.
  """
  recheckAgentBackend(backendId: String): AgentBackendStatus!
  updateRepositorySettings(input: UpdateRepositorySettingsInput!): Repository!
  pauseRepository(repositoryId: ID!): Repository!
  unpauseRepository(repositoryId: ID!): Repository!
}

type Subscription {
  repositoriesChanged: Boolean!
  issuesChanged(repositoryId: ID!): Boolean!
  repositoryIssuesChanged: ID!
  repositoryWorkItemsChanged: ID!
}
