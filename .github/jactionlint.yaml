# yaml-language-server: $schema=https://raw.githubusercontent.com/jdx/jactionlint/main/schema/jactionlint-config.json
# Default profile: correctness plus the security and policy rules that fail CI.
profile: default

ignores:
  # The version comes from the npm package so the installer's unauthenticated
  # latest endpoint is not used. The official v2 installer is what places the
  # CLI at ~/.opencode/bin; pinning a tarball instead would change that install.
  - rule: unverified-download
    file: .github/workflows/pr.yml
    step: Install OpenCode
    reason: official OpenCode 2 installer, version resolved from npm

  - rule: unverified-download
    file: .github/workflows/ci-cd.yml
    step: Install OpenCode
    reason: official OpenCode 2 installer, version resolved from npm
