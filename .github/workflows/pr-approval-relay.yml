# Dispatch Claude Code Review once PR checks actually start — the only
# automatic review path for every human-authored PR, owner included.
# workflow_run shares the PR workflow's first-time-contributor Enable gate:
# a first-timer's checks only start after that click.
name: Claude review relay

on:
  # workflow_run fires when the PR workflow actually starts — immediately for
  # known contributors, after the Enable click for first-timers. See
  # .github/jactionlint.yaml.
  workflow_run:
    workflows: ["PR"]
    types: [in_progress]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-review:
    # Re-runs of unchanged PR checks must not start duplicate paid reviews;
    # each dispatch cancels the review still running for that PR.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Claude review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          pr_meta="$(
            gh api --method GET "repos/${GH_REPO}/pulls" \
              -f state=open \
              -f "head=${HEAD_OWNER}:${HEAD_BRANCH}" \
              --jq ".[0] | select(. != null) | {number, login: .user.login, type: .user.type}"
          )"
          if [ -z "${pr_meta}" ]; then
            echo "No open PR for ${HEAD_OWNER}:${HEAD_BRANCH}"
            exit 0
          fi
          login="$(printf '%s' "${pr_meta}" | jq -r '.login')"
          type="$(printf '%s' "${pr_meta}" | jq -r '.type')"
          number="$(printf '%s' "${pr_meta}" | jq -r '.number')"
          # The review action rejects bots outside its allowed_bots list, and
          # dependency bumps do not need a Claude review.
          if [ "${type}" = "Bot" ]; then
            echo "Skipping bot ${login} (#${number})"
            exit 0
          fi
          gh workflow run "Claude Code Review" \
            --repo "${GH_REPO}" \
            --ref "${DEFAULT_BRANCH}" \
            -f "pr_number=${number}"
