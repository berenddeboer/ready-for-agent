name: Claude Code Review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Match the sibling workflows: default to no permissions; the job below
# grants itself only what the review needs.
permissions: {}

jobs:
  claude-review:
    timeout-minutes: 25
    # Reviews post for the repository owner and approved contributors
    # (anyone who can push a branch here) on every push. Fork PRs need
    # pull_request_target to post with base-repo secrets; plain
    # pull_request cannot, so they get no Claude review.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    env:
      # Headless runs exit when the parent finishes, terminating background
      # review agents before their findings can be aggregated.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: write

    steps:
      - name: Checkout pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Authenticate Git fetches for review
        # The checkout persists no credentials; Claude's git and gh reads of
        # the same repository still need them.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git --hostname github.com

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1.0.251
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Workflow re-runs appear as github-actions[bot]. Explicit
          # allowlist — not '*' — so only this trusted platform bot can
          # trigger the review action.
          allowed_bots: github-actions
          track_progress: true
          additional_permissions: |
            actions: read
          # The skill is read from the PR's own checkout. Only authors with
          # push access can open same-repo PRs, so it is as trusted as any
          # branch they can push.
          prompt: '/code-review origin/${{ github.event.pull_request.base.ref }}'
          # Permit only the local review skill, its required sub-agent, and
          # read-only repository inspection commands.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Skill(code-review),Agent(general-purpose),Bash(ls:*),Bash(cat:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git rev-parse:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Write,Edit,NotebookEdit,WebFetch,WebSearch"
