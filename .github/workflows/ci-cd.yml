name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Job permissions are set on each job so a later job does not inherit
# actions: write. The release job publishes npm, so a newer run waits
# instead of cancelling one that is in progress, and pending runs are kept.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  # Dependency pin integrity: full SHAs + version comments match upstream releases.
  pinact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 1
          persist-credentials: false

      - name: Verify GitHub Action pins
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          verify: "true"
          # Built-in GITHUB_TOKEN only; pinact uses it for release/tag lookups.
          github_token: ${{ github.token }}

  # Default-profile jactionlint for every workflow and local composite action.
  # Not an Nx affected target: workflow-only and action-only changes still run.
  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned jactionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^jactionlint = "\([^"]*\)"/\1/p' mise.toml)"
          test -n "${VERSION}"
          tmp="$(mktemp -d)"
          archive="jactionlint_${VERSION}_linux_amd64.tar.gz"
          checksums="jactionlint_${VERSION}_checksums.txt"
          gh release download --repo jdx/jactionlint --dir "${tmp}" \
            --pattern "${archive}" \
            --pattern "${checksums}" \
            "v${VERSION}"
          (
            cd "${tmp}"
            sha256sum --check --ignore-missing "${checksums}"
          )
          gh attestation verify --repo jdx/jactionlint "${tmp}/${archive}"
          tar -xzf "${tmp}/${archive}" -C "${tmp}" jactionlint
          sudo install -m 0755 "${tmp}/jactionlint" /usr/local/bin/jactionlint
          jactionlint --version
          jactionlint --version | grep -F "${VERSION}"

      - name: Lint GitHub Actions workflows
        run: jactionlint --format github

  # Quality gates + cheap harness slow-test (SSE idle-timeout). Parallel with
  # `harness` (smoke + live e2e); no artifact handoff between the two.
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # actions: write — save the main-branch Nx cache
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install Usage CLI
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^usage = "\([^"]*\)"/\1/p' mise.toml)"
          test -n "${VERSION}"
          curl -fsSL "https://github.com/jdx/usage/releases/download/v${VERSION}/usage-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /tmp
          sudo install -m 0755 /tmp/usage /usr/local/bin/usage
          usage --version
          usage --version | grep -F "${VERSION}"

      # Required when affected packages run OpenCode integration tests.
      # OpenCode 1's installer refuses 2.x. Resolve the current OpenCode 2
      # package, then pin --version so the installer does not call its
      # unauthenticated latest endpoint.
      - name: Install OpenCode
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://registry.npmjs.org/@opencode/cli/latest \
            | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p')
          test -n "$VERSION"
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$VERSION" --no-modify-path
      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: bunx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - run: bun install --no-cache --frozen-lockfile --linker=isolated && bun install --no-cache --frozen-lockfile --linker=isolated

      # Primary main-branch cache producer (restore + save under nx-main-${{ github.sha }}).
      - name: Restore/save Nx cache
        uses: ./.github/actions/nx-cache
        with:
          mode: main

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: bun nx record -- echo Hello World
      # Push to main: affected quality gates. Manual release dispatch: full suite.
      - name: Quality gates
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bash scripts/ci-owned-execution.sh bun nx run-many -t lint knip test typecheck check-usage
          else
            bash scripts/ci-owned-execution.sh bun nx affected -t lint knip test typecheck check-usage
          fi

      # Production SSE idle-timeout (~13s) is excluded from harness:test so the
      # default suite can run with Bun --parallel. Keep the real heartbeat gate.
      - name: Harness slow tests
        run: bash scripts/ci-owned-execution.sh bunx nx run harness:slow-test

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      # - run: bun nx fix-ci
      #   if: always()

  # Dev smoke + live Gherkin e2e. Independent of quality-gates (parallel job).
  # Two live suites (issue #958): vault-free @no-backend first (no OpenCode),
  # then vault-backed OpenCode suite (excludes @no-backend). Vault-backed
  # e2e is fail-closed when the secret is missing (trusted main). Overnight
  # install smoke remains the packaging multi-arch gate.
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # actions: write — upload Playwright diagnostics on live e2e failure
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --no-cache --frozen-lockfile --linker=isolated && bun install --no-cache --frozen-lockfile --linker=isolated

      # Restore only: quality-gates is the main cache producer.
      - name: Restore Nx cache
        uses: ./.github/actions/nx-cache
        with:
          mode: restore-main

      # Chromium before dev smoke: that step loads the Vite page in a browser.
      # The same install serves both live suites.
      - name: Install Playwright Chromium
        working-directory: apps/harness
        run: bunx playwright install --with-deps chromium

      # Dev-path smoke (Bun + Vite). Loads the page in Chromium; no vault.
      - name: Harness dev smoke
        run: bash scripts/ci-owned-execution.sh bunx nx run harness:smoke

      - name: Live Harness e2e (uninitialized Keymaxxer)
        id: live-e2e-no-vault
        run: bash scripts/ci-owned-execution.sh bunx nx run harness:e2e-no-vault

      # Product default-backend / first-run without OpenCode (vault-free).
      - name: Live Harness e2e (no backend agents)
        id: live-e2e-no-backend
        run: bash scripts/ci-owned-execution.sh bunx nx run harness:e2e-no-backend

      - name: Upload Playwright diagnostics (no backend)
        if: failure() && steps.live-e2e-no-backend.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-no-backend
          path: |
            apps/harness/playwright-report/
            apps/harness/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Vault-backed OpenCode suite (also on PRs via pr.yml when secret available).
      - name: Require live e2e vault key
        env:
          E2E_KEYMAXXER_MASTER_KEY: ${{ secrets.E2E_KEYMAXXER_MASTER_KEY }}
        run: |
          if [ -z "${E2E_KEYMAXXER_MASTER_KEY}" ]; then
            echo "error: repository secret E2E_KEYMAXXER_MASTER_KEY is required for the vault-backed live Harness e2e step" >&2
            exit 1
          fi

      # OpenCode for vault-backed suite only: first-run model catalog via
      # `opencode api --standalone get /api/model` (empty catalog fails that suite).
      - name: Install OpenCode
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://registry.npmjs.org/@opencode/cli/latest \
            | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p')
          test -n "$VERSION"
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$VERSION" --no-modify-path
      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Live Harness e2e (with OpenCode)
        id: live-e2e
        env:
          E2E_KEYMAXXER_MASTER_KEY: ${{ secrets.E2E_KEYMAXXER_MASTER_KEY }}
          KEYMAXXER_MASTER_KEY: ${{ secrets.E2E_KEYMAXXER_MASTER_KEY }}
          KEYMAXXER_APPROVE: deny
        run: bash scripts/ci-owned-execution.sh bunx nx run harness:e2e

      - name: Upload Playwright diagnostics
        if: failure() && steps.live-e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/harness/playwright-report/
            apps/harness/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Distribution-boundary gate: pack launcher + host platform package, install
  # outside the checkout, run without Bun/Nx. Complementary to live Gherkin e2e.
  packed-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # actions: write — upload packed-install diagnostics on failure
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # Required host tool for product preflight (ambient-auth smoke).
      - name: Install OpenCode
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://registry.npmjs.org/@opencode/cli/latest \
            | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p')
          test -n "$VERSION"
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$VERSION" --no-modify-path
      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - run: bun install --no-cache --frozen-lockfile --linker=isolated && bun install --no-cache --frozen-lockfile --linker=isolated

      # Restore only: quality-gates is the main cache producer.
      - name: Restore Nx cache
        uses: ./.github/actions/nx-cache
        with:
          mode: restore-main

      - name: Packed-install Harness smoke
        id: packed-install
        env:
          PACKED_INSTALL_DIAGNOSTICS_DIR: ${{ runner.temp }}/packed-install-diagnostics
        run: bash scripts/ci-owned-execution.sh bunx nx run ready-for-agent:packed-install-smoke

      - name: Upload packed-install diagnostics
        if: failure() && steps.packed-install.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-install-diagnostics
          path: ${{ runner.temp }}/packed-install-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  # Required OpenCode V2 command contracts. Always runs: not affected, not
  # path-filtered, and no secrets. Installs the mise.toml baseline and fails
  # if the resolved binary is missing, not that version, or not V2.
  # Scheduled latest coverage is opencode-cli-contract-drift.yml.
  opencode-cli-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --no-cache --frozen-lockfile --linker=isolated && bun install --no-cache --frozen-lockfile --linker=isolated

      - name: Install pinned OpenCode baseline
        run: bash scripts/install-opencode-v2.sh baseline

      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: OpenCode CLI contract
        env:
          OPENCODE_CONTRACT_MODE: baseline
          OPENCODE_CONTRACT_DIAGNOSTICS_DIR: ${{ runner.temp }}/opencode-cli-contract
        run: bash scripts/ci-owned-execution.sh bunx nx run opencode:cli-contract --skip-nx-cache

      - name: Upload OpenCode contract diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencode-cli-contract
          path: ${{ runner.temp }}/opencode-cli-contract/
          if-no-files-found: ignore
          retention-days: 14

  release:
    # Manual release only, from main (never on PR/push).
    # Requires quality gates, harness, packed-install, pinact, jactionlint,
    # and the pinned OpenCode contract job before publish.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [quality-gates, harness, packed-install, pinact, jactionlint, opencode-cli-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      # Credentials stay in git config so the tag push below can authenticate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --no-cache --frozen-lockfile --linker=isolated && bun install --no-cache --frozen-lockfile --linker=isolated

      # Restore only: quality-gates is the main cache producer.
      - name: Restore Nx cache
        uses: ./.github/actions/nx-cache
        with:
          mode: restore-main

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(bun --conditions @ready-for-agent/source packages/release-versioning/src/bin/compute-next-version.ts)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${VERSION}"

      - name: Apply publish versions
        run: |
          bun --conditions @ready-for-agent/source \
            packages/release-versioning/src/bin/apply-publish-versions.ts \
            "${{ steps.version.outputs.version }}" \
            --for-publish

      - name: Compile platform binaries
        run: |
          set -euo pipefail
          platforms=(linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64)
          for platform in "${platforms[@]}"; do
            bunx nx run ready-for-agent:compile --platform="${platform}"
          done
          # Cross-compiled packages: structural validation only (file + executable bit).
          # Full runtime smoke runs on the host platform via packed-install-smoke.
          # Host packed-install remains Linux-runner only (no windows-latest runtime smoke).
          for platform in "${platforms[@]}"; do
            if [[ "${platform}" == win32-* ]]; then
              binary="packages/ready-for-agent-${platform}/bin/ready-for-agent.exe"
            else
              binary="packages/ready-for-agent-${platform}/bin/ready-for-agent"
            fi
            test -f "${binary}"
            test -x "${binary}"
          done

      # Re-run distribution smoke against versioned release binaries before publish.
      - name: Install OpenCode
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://registry.npmjs.org/@opencode/cli/latest \
            | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p')
          test -n "$VERSION"
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$VERSION" --no-modify-path
      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Host packed-install smoke (release artifacts)
        id: release-packed-install
        env:
          PACKED_INSTALL_DIAGNOSTICS_DIR: ${{ runner.temp }}/packed-install-diagnostics
        run: bash scripts/ci-owned-execution.sh bunx nx run ready-for-agent:packed-install-smoke --args=--skip-compile

      - name: Upload release packed-install diagnostics
        if: failure() && steps.release-packed-install.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packed-install-diagnostics
          path: ${{ runner.temp }}/packed-install-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish packages to npm (OIDC + provenance)
        run: |
          set -euo pipefail
          publish_if_missing() {
            local package_name package_version
            package_name="$(node -p "require('./package.json').name")"
            package_version="$(node -p "require('./package.json').version")"

            if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published; skipping."
            else
              npm publish --access public --provenance
            fi
          }
          # Platform packages first so optionalDependencies resolve on install.
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            (
              cd "packages/ready-for-agent-${platform}"
              publish_if_missing
            )
          done
          (
            cd apps/ready-for-agent
            publish_if_missing
          )

      - name: Create git tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

          mkdir -p dist-release
          assets=()
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            if [[ "${platform}" == win32-* ]]; then
              src="packages/ready-for-agent-${platform}/bin/ready-for-agent.exe"
              dest="dist-release/ready-for-agent-${platform}.exe"
            else
              src="packages/ready-for-agent-${platform}/bin/ready-for-agent"
              dest="dist-release/ready-for-agent-${platform}"
            fi
            cp "${src}" "${dest}"
            assets+=("${dest}")
          done

          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            "${assets[@]}"
