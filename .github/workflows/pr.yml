name: PR

on:
  pull_request:

# Job permissions are set on each job so a later job does not inherit
# actions: write.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency pin integrity: full SHAs + version comments match upstream releases.
  pinact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 1
          persist-credentials: false

      - name: Verify GitHub Action pins
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          verify: "true"
          # Built-in GITHUB_TOKEN only; pinact uses it for release/tag lookups.
          github_token: ${{ github.token }}

  # Default-profile jactionlint for every workflow and local composite action.
  # Not an Nx affected target: workflow-only and action-only changes still run.
  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned jactionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^jactionlint = "\([^"]*\)"/\1/p' mise.toml)"
          test -n "${VERSION}"
          tmp="$(mktemp -d)"
          archive="jactionlint_${VERSION}_linux_amd64.tar.gz"
          checksums="jactionlint_${VERSION}_checksums.txt"
          gh release download --repo jdx/jactionlint --dir "${tmp}" \
            --pattern "${archive}" \
            --pattern "${checksums}" \
            "v${VERSION}"
          (
            cd "${tmp}"
            sha256sum --check --ignore-missing "${checksums}"
          )
          gh attestation verify --repo jdx/jactionlint "${tmp}/${archive}"
          tar -xzf "${tmp}/${archive}" -C "${tmp}" jactionlint
          sudo install -m 0755 "${tmp}/jactionlint" /usr/local/bin/jactionlint
          jactionlint --version
          jactionlint --version | grep -F "${VERSION}"

      - name: Lint GitHub Actions workflows
        run: jactionlint --format github

  # Quality gates + cheap harness slow-test (SSE idle-timeout). Parallel with
  # the live e2e jobs; no artifact handoff between them.
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # actions: write — save PR-scoped Nx caches (same-repo PRs only)
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          install_args: bun

      - name: Install Usage CLI
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^usage = "\([^"]*\)"/\1/p' mise.toml)"
          test -n "${VERSION}"
          curl -fsSL "https://github.com/jdx/usage/releases/download/v${VERSION}/usage-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /tmp
          sudo install -m 0755 /tmp/usage /usr/local/bin/usage
          usage --version
          usage --version | grep -F "${VERSION}"

      # Required when affected packages run OpenCode integration tests.
      # OpenCode 1's installer refuses 2.x. Resolve the current OpenCode 2
      # package, then pin --version so the installer does not call its
      # unauthenticated latest endpoint.
      - name: Install OpenCode
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://registry.npmjs.org/@opencode/cli/latest \
            | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p')
          test -n "$VERSION"
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$VERSION" --no-modify-path
      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - run: bun install --no-cache --frozen-lockfile --linker=isolated && bun install --no-cache --frozen-lockfile --linker=isolated

      - name: Restore/save Nx cache
        uses: ./.github/actions/nx-cache
        with:
          mode: pr
          pr-number: ${{ github.event.pull_request.number }}
          # Forks and Dependabot get a read-only token for cache writes; restore only.
          allow-save: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - name: Quality gates
        run: bash scripts/ci-owned-execution.sh bun nx affected -t lint knip test typecheck check-usage

      # Production SSE idle-timeout (~13s) is excluded from harness:test so the
      # default suite can run with Bun --parallel. Keep the real heartbeat gate.
      - name: Harness slow tests
        run: bash scripts/ci-owned-execution.sh bunx nx run harness:slow-test

  # Live-Forge e2e (issue #999): add/refresh, Intake, catalog-only fixture path.
  # Parallel with UI-history. Same-repo PRs fail closed without the vault
  # secret; fork PRs skip this suite (secrets are not exposed).
  harness-e2e-live-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # actions: write — Playwright cache save and failure-report upload
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          install_args: bun

      - run: bun install --no-cache --frozen-lockfile --linker=isolated && bun install --no-cache --frozen-lockfile --linker=isolated

      # Restore only: quality-gates is the PR cache producer.
      - name: Restore Nx cache
        uses: ./.github/actions/nx-cache
        with:
          mode: pr
          pr-number: ${{ github.event.pull_request.number }}
          allow-save: "false"

      - name: Restore/install Playwright Chromium
        uses: ./.github/actions/playwright-chromium
        with:
          allow-save: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}

      - name: Check live-Forge vault key
        id: e2e-vault
        env:
          E2E_KEYMAXXER_MASTER_KEY: ${{ secrets.E2E_KEYMAXXER_MASTER_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${E2E_KEYMAXXER_MASTER_KEY}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "error: same-repo PR requires repository secret E2E_KEYMAXXER_MASTER_KEY for live-Forge e2e" >&2
            exit 1
          fi
          echo "has_key=false" >> "$GITHUB_OUTPUT"
          echo "Skipping live-Forge e2e: E2E_KEYMAXXER_MASTER_KEY is unavailable (expected for fork PRs)."

      - name: Install OpenCode
        if: steps.e2e-vault.outputs.has_key == 'true'
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://registry.npmjs.org/@opencode/cli/latest \
            | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p')
          test -n "$VERSION"
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$VERSION" --no-modify-path
      - name: Add OpenCode to PATH
        if: steps.e2e-vault.outputs.has_key == 'true'
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Live-Forge Harness e2e
        if: steps.e2e-vault.outputs.has_key == 'true'
        id: live-e2e-live-forge
        env:
          E2E_KEYMAXXER_MASTER_KEY: ${{ secrets.E2E_KEYMAXXER_MASTER_KEY }}
          KEYMAXXER_MASTER_KEY: ${{ secrets.E2E_KEYMAXXER_MASTER_KEY }}
          KEYMAXXER_APPROVE: deny
        run: bash scripts/ci-owned-execution.sh bunx nx run harness:e2e-live-forge

      - name: Upload Playwright diagnostics (live-Forge)
        if: failure() && steps.live-e2e-live-forge.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-live-forge
          path: |
            apps/harness/playwright-report/
            apps/harness/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # UI-history e2e (issue #999): Settings / Repository settings / Session
  # Telemetry history and Kanban that seed persistence. Vault-free. Also
  # owns fork-safe @no-backend (issue #958). May install OpenCode for
  # Settings catalog coverage.
  harness-e2e-ui-history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # actions: write — Playwright cache save and failure-report upload
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          install_args: bun

      - run: bun install --no-cache --frozen-lockfile --linker=isolated && bun install --no-cache --frozen-lockfile --linker=isolated

      # Restore only: quality-gates is the PR cache producer.
      - name: Restore Nx cache
        uses: ./.github/actions/nx-cache
        with:
          mode: pr
          pr-number: ${{ github.event.pull_request.number }}
          allow-save: "false"

      # Chromium before dev smoke: that step loads the Vite page in a browser.
      - name: Restore/install Playwright Chromium
        uses: ./.github/actions/playwright-chromium
        with:
          allow-save: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}

      # Dev-path smoke (Bun + Vite). Loads the page in Chromium; no vault.
      - name: Harness dev smoke
        run: bash scripts/ci-owned-execution.sh bunx nx run harness:smoke

      - name: Live Harness e2e (uninitialized Keymaxxer)
        id: live-e2e-no-vault
        run: bash scripts/ci-owned-execution.sh bunx nx run harness:e2e-no-vault

      - name: Live Harness e2e (no backend agents)
        id: live-e2e-no-backend
        run: bash scripts/ci-owned-execution.sh bunx nx run harness:e2e-no-backend

      - name: Upload Playwright diagnostics (no backend)
        if: failure() && steps.live-e2e-no-backend.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-no-backend
          path: |
            apps/harness/playwright-report/
            apps/harness/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Settings first-run / catalog coverage prefers OpenCode when listed.
      - name: Install OpenCode
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://registry.npmjs.org/@opencode/cli/latest \
            | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p')
          test -n "$VERSION"
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$VERSION" --no-modify-path
      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: UI-history Harness e2e
        id: live-e2e-ui-history
        run: bash scripts/ci-owned-execution.sh bunx nx run harness:e2e-ui-history

      - name: Upload Playwright diagnostics (UI-history)
        if: failure() && steps.live-e2e-ui-history.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-ui-history
          path: |
            apps/harness/playwright-report/
            apps/harness/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Required-check identity: existing `harness` still gates the PR after the
  # serial job was split (issue #999).
  harness:
    if: always()
    needs: [harness-e2e-live-forge, harness-e2e-ui-history]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require both live e2e jobs
        run: |
          set -euo pipefail
          live="${{ needs.harness-e2e-live-forge.result }}"
          ui="${{ needs.harness-e2e-ui-history.result }}"
          echo "live-forge=${live} ui-history=${ui}"
          test "${live}" = success
          test "${ui}" = success

  # Required OpenCode V2 command contracts. Always runs: not affected, not
  # path-filtered, and no secrets. Installs the mise.toml baseline and fails
  # if the resolved binary is missing, not that version, or not V2.
  # Scheduled latest coverage is opencode-cli-contract-drift.yml.
  opencode-cli-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 1
          persist-credentials: false

      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          install_args: bun

      - run: bun install --no-cache --frozen-lockfile --linker=isolated && bun install --no-cache --frozen-lockfile --linker=isolated

      - name: Install pinned OpenCode baseline
        run: bash scripts/install-opencode-v2.sh baseline

      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: OpenCode CLI contract
        env:
          OPENCODE_CONTRACT_MODE: baseline
          OPENCODE_CONTRACT_DIAGNOSTICS_DIR: ${{ runner.temp }}/opencode-cli-contract
        run: bash scripts/ci-owned-execution.sh bunx nx run opencode:cli-contract --skip-nx-cache

      - name: Upload OpenCode contract diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencode-cli-contract
          path: ${{ runner.temp }}/opencode-cli-contract/
          if-no-files-found: ignore
          retention-days: 14
