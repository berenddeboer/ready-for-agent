name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  # Dependency pin integrity: full SHAs + version comments match upstream releases.
  pinact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 1
          persist-credentials: false

      - name: Verify GitHub Action pins
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          verify: "true"
          # Built-in GITHUB_TOKEN only; pinact uses it for release/tag lookups.
          github_token: ${{ github.token }}

  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Required when affected packages run OpenCode integration tests.
      # Resolve the release via authenticated GitHub API then pin the installer
      # --version flag: bare `opencode.ai/install` hits unauthenticated
      # /releases/latest and fails under Actions rate limits.
      - name: Install OpenCode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/anomalyco/opencode/releases/latest \
            | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')
          test -n "$VERSION"
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$VERSION" --no-modify-path
      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - run: bun install --no-cache --frozen-lockfile --linker=isolated && bun install --no-cache --frozen-lockfile --linker=isolated
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Quality gates
        run: bun nx affected -t lint knip test typecheck

      # Production SSE idle-timeout (~13s) is excluded from harness:test so the
      # default suite can run with Bun --parallel. Keep the real heartbeat gate.
      - name: Harness slow tests
        run: bunx nx run harness:slow-test

      # Dev-path GraphQL smoke (Bun + Vite SSR); no Keymaxxer vault required.
      - name: Harness dev smoke
        run: bunx nx run harness:smoke
