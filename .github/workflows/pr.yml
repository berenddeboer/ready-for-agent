name: PR

on:
  pull_request:

permissions:
  # upload-artifact attaches to this run; GITHUB_TOKEN does not need actions:write
  actions: read
  contents: read

jobs:
  # Dependency pin integrity: full SHAs + version comments match upstream releases.
  pinact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 1
          persist-credentials: false

      - name: Verify GitHub Action pins
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          verify: "true"
          # Built-in GITHUB_TOKEN only; pinact uses it for release/tag lookups.
          github_token: ${{ github.token }}

  # Quality gates + cheap harness slow-test (SSE idle-timeout). Parallel with
  # `harness` (smoke + live e2e); no artifact handoff between the two.
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Required when affected packages run OpenCode integration tests.
      # Resolve the release via authenticated GitHub API then pin the installer
      # --version flag: bare `opencode.ai/install` hits unauthenticated
      # /releases/latest and fails under Actions rate limits.
      - name: Install OpenCode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/anomalyco/opencode/releases/latest \
            | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')
          test -n "$VERSION"
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$VERSION" --no-modify-path
      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - run: bun install --no-cache --frozen-lockfile --linker=isolated && bun install --no-cache --frozen-lockfile --linker=isolated
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Quality gates
        run: bun nx affected -t lint knip test typecheck

      # Production SSE idle-timeout (~13s) is excluded from harness:test so the
      # default suite can run with Bun --parallel. Keep the real heartbeat gate.
      - name: Harness slow tests
        run: bunx nx run harness:slow-test

  # Dev smoke + live Gherkin e2e. Independent of quality-gates (parallel job).
  # OpenCode CLI is not installed here: smoke/e2e do not invoke it.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --no-cache --frozen-lockfile --linker=isolated && bun install --no-cache --frozen-lockfile --linker=isolated

      # Dev-path GraphQL smoke (Bun + Vite SSR); no Keymaxxer vault required.
      # Production live e2e below remains vault-backed and separate.
      - name: Harness dev smoke
        run: bunx nx run harness:smoke

      # Live Gherkin e2e (vault-backed, same suite as ci-cd.yml on main).
      # Same-repo PRs can read E2E_KEYMAXXER_MASTER_KEY; fork PRs cannot, so
      # skip rather than fail-closed when the secret is empty.
      - name: Check live e2e vault key
        id: e2e-vault
        env:
          E2E_KEYMAXXER_MASTER_KEY: ${{ secrets.E2E_KEYMAXXER_MASTER_KEY }}
        run: |
          if [ -z "${E2E_KEYMAXXER_MASTER_KEY}" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "Skipping live Harness e2e: E2E_KEYMAXXER_MASTER_KEY is unavailable (expected for fork PRs)."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Chromium
        if: steps.e2e-vault.outputs.has_key == 'true'
        working-directory: apps/harness
        run: bunx playwright install --with-deps chromium

      - name: Live Harness e2e
        if: steps.e2e-vault.outputs.has_key == 'true'
        id: live-e2e
        env:
          E2E_KEYMAXXER_MASTER_KEY: ${{ secrets.E2E_KEYMAXXER_MASTER_KEY }}
          KEYMAXXER_MASTER_KEY: ${{ secrets.E2E_KEYMAXXER_MASTER_KEY }}
          KEYMAXXER_APPROVE: deny
        run: bunx nx run harness:e2e

      - name: Upload Playwright diagnostics
        if: failure() && steps.live-e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/harness/playwright-report/
            apps/harness/test-results/
          if-no-files-found: ignore
          retention-days: 14
